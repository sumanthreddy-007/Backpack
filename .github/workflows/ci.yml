name: Backpack CI

# Run only when manually requested from the GitHub Actions tab.
# Automatic checks are disabled while the project is being stabilized.
on:
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install scikit-learn==1.8.0 psycopg2-binary python-dotenv python-dateutil fastapi==0.136.1 python-multipart==0.0.27 python-docx==1.2.0 reportlab==4.4.9 pypdf==3.20.0 pillow==12.2.0 pytest
      - run: python -m pytest -q
